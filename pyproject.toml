[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hamstring-benchmarking"
version = "0.1.0"
description = "Benchmarking suite for the HAMSTRING NDR"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyMuPDF~=1.26.7",
    "numpy~=2.3.5",
    "pandas~=2.3.3",
    "matplotlib~=3.10.8",
    "polars~=1.36.1",
    "torch~=2.9.1",
    "colorlog~=6.10.1",
    "PyYAML~=6.0.3",
    "kafka-python~=2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
